name: build

# every push builds the installer with the latest Phigros++ release's patch (signed with a throwaway key), a v* tag
# also signs it with the installer's key and publishes it as a release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - run: nix-shell --run "make release-patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phigrospp-installer-test-key
          path: out/phigrospp-installer.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)"
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Build
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE" | base64 -d > keystore.jks
          nix-shell --run "make release-patch"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/phigrospp-installer.apk \
            --title "Phigros++ Installer ${GITHUB_REF_NAME#v}" --generate-notes --latest
